{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flashes">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}">
        <span>{{ message }}</span>
        <button type="button" class="flash-close" onclick="this.parentElement.remove()" aria-label="Закрыть">×</button>
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}
