{% extends "base.html" %}

{% block title %}Вход - Kaspi{% endblock %}

{% block content %}
<div class="register-page">
    <div class="register-card">
        <div class="register-icon">🔑</div>

        <h1>Вход в аккаунт</h1>
        <p class="register-subtitle">Покупатели, продавцы и администраторы входят здесь</p>

        <form action="{{ url_for('account.login') }}" method="POST">
            {{ csrf_field() }}
            {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus
                       value="{{ email }}" placeholder="example@mail.com" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required
                       placeholder="Ваш пароль" autocomplete="current-password">
            </div>

            <button type="submit" class="register-btn">Войти</button>
        </form>

        <div class="register-footer">
            Нет аккаунта? <a href="{{ url_for('account.register') }}">Зарегистрироваться</a>
        </div>
    </div>
</div>
{% endblock %}
